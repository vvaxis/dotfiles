# ==========================================================
#  HYPRLOCK — SWORDFISH II ONBOARD TERMINAL
# ==========================================================

general {
    hide_cursor = true
    immediate_render = true
    fractional_scaling = 2
}

auth {
    pam:enabled = true
}

animations {
    enabled = true
}

# --- Background ---
background {
    path = /home/vvaxis/Pictures/wallpapers/phoenix-space2.png
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
}

# --- Terminal panel ---
shape {
    size = 520, 340
    color = rgba(5, 5, 12, 0.85)
    border_size = 1
    border_color = rgba(149, 90, 231, 0.35)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_boost = 1.8
    shadow_color = rgba(0, 0, 0, 0.60)
}

# --- Top accent ---
shape {
    size = 518, 2
    color = rgba(149, 90, 231, 0.70)
    rounding = 0
    position = 0, 169
    halign = center
    valign = center
}

# --- Header ---
label {
    text = SWORDFISH II  ///  DECK TERMINAL
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = rgba(0, 217, 233, 0.80)
    position = 0, 136
    halign = center
    valign = center
}

# --- Clock ---
label {
    text = cmd[update:1000] date +"%H:%M"
    font_family = JetBrainsMono Nerd Font
    font_size = 56
    color = rgba(0, 217, 233, 0.95)
    position = 0, 68
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +"%A, %d %B %Y"
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    color = rgba(0, 217, 233, 0.40)
    position = 0, 26
    halign = center
    valign = center
}

# --- Auth ---
label {
    text = CREW: $USER  —  TERMINAL LOCKED
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    color = rgba(0, 217, 233, 0.45)
    position = 0, -30
    halign = center
    valign = center
}

# --- Password input ---
input-field {
    size = 340, 40
    outline_thickness = 1
    inner_color = rgba(5, 5, 12, 0.50)
    outer_color = rgba(149, 90, 231, 0.50)
    font_color = rgba(0, 217, 233, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    rounding = 0
    fade_on_empty = false
    dots_size = 0.4
    dots_spacing = 0.3
    dots_rounding = 0
    placeholder_text = >>> ENTER AUTH KEY
    fail_text = >>> ACCESS DENIED
    fail_color = rgba(242, 93, 148, 1.0)
    check_color = rgba(149, 90, 231, 0.80)
    halign = center
    valign = center
    position = 0, -76
}

# --- Footer ---
label {
    text = AUTHORIZED PERSONNEL ONLY
    font_family = JetBrainsMono Nerd Font
    font_size = 9
    color = rgba(149, 90, 231, 0.35)
    position = 0, -124
    halign = center
    valign = center
}
