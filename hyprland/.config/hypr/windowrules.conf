# =========================
# WINDOW RULES CONFIG 0.53+
# =========================

# Smart gaps examples (disabled by default)
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, match:float no, match:onworkspace w[tv1]
# windowrule = rounding 0, match:float no, match:onworkspace w[tv1]
# windowrule = bordersize 0, match:float no, match:onworkspace f[1]
# windowrule = rounding 0, match:float no, match:onworkspace f[1]

# Ignore maximize requests from apps
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix XWayland drag issues
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = windowrule-3
  stay_focused = on
  match:class = zoom
  match:title = menu window
}

windowrule {
  name = windowrule-4
  stay_focused = on
  match:class = zoom
  match:title = confirm window
}


# === VM virt-manager window ===
windowrule {
  name = windowrule-vm
  float = on
  size = 1280 800
  match:class = ^(virt-manager)$
}

# === Regras para o terminal do calcurse ===
# (baseado na class e no title definidos no script)

# Faz a janela abrir em modo flutuante
# Define tamanho: largura 70% da tela, altura 60%
# Move a janela para o canto superior direito (80% - 70% = sobra de 10% à esquerda)
# Abre sempre no workspace atual
windowrule {
  name = windowrule-5
  float = on
  size = (monitor_w*0.45) (monitor_h*0.4)
  move = ((monitor_w*1.09)-(monitor_w*0.55)) ((monitor_w*1.0)-(monitor_w*0.965))
  workspace = current
  match:class = ^(calendar)$
}

# (Opcional) evitar que roube foco de outras janelas:
# windowrule {
#   name = windowrule-calendar-nofocus
#   no_focus = on
#   match:class = ^(calendar)$
# }

# === Spotify scratchpad ===
windowrule {
  name = spotify-scratchpad
  workspace = special:spotify silent
  float = on
  size = 1440 810
  center = on
  opacity = 0.88
  match:class = ^([Ss]potify)$
}

# === btop scratchpad ===
windowrule {
  name = btop-scratchpad
  workspace = special:btop silent
  float = on
  size = 1248 756
  center = on
  opacity = 0.88
  match:class = ^(btop-scratchpad)$
}

# === Terminal scratchpad ===
windowrule {
  name = term-scratchpad
  workspace = special:term silent
  float = on
  size = 1400 540
  move = 260 540
  opacity = 0.88
  match:class = ^(term-scratchpad)$
}

# === WhatsApp scratchpad ===
windowrule {
  name = whatsapp-scratchpad
  workspace = special:whatsapp silent
  float = on
  size = 1440 810
  center = on
  opacity = 1.0
  match:class = ^(wasistlos)$
}

# === Audio scratchpad (wiremix) ===
windowrule {
  name = audio-scratchpad
  workspace = special:audio silent
  float = on
  size = 1000 620
  center = on
  opacity = 1.0
  match:class = ^(audio-scratchpad)$
}

# === Bluetooth scratchpad ===
windowrule {
  name = bt-scratchpad
  workspace = special:bluetooth silent
  float = on
  size = 900 600
  center = on
  opacity = 1.0
  match:class = ^(bt-scratchpad)$
}

layerrule {
  name = layerrule-1
  blur = on
  match:namespace = class:^(calendar)$
}
