"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
scan_timeout = 100

format = """
[](fg:#8a56dc)\
$username\
[](fg:#8a56dc bg:#6c35c4)\
$hostname\
[](fg:#6c35c4 bg:#4f46b5)\
$os\
[](fg:#4f46b5 bg:#3d2e8a)\
$directory\
[](fg:#3d2e8a bg:#332680)\
$git_branch\
$git_status\
[](fg:#332680)\
$fill\
$cmd_duration\
$python\
$nodejs\
$rust\
$golang\
$lua\
$line_break\
$character"""

[username]
show_always = true
style_user = "bg:#8a56dc fg:#010204 bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:#6c35c4 fg:#c0caf5 bold"
format = "[ $hostname ]($style)"

[os]
disabled = false
style = "bg:#4f46b5 fg:#c0caf5 bold"

[os.symbols]
Arch = " 󰣇 "
Linux = " "

[directory]
style = "bg:#3d2e8a fg:#c0caf5 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#332680 fg:#c0caf5"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#332680 fg:#d4a031"
format = "[$all_status$ahead_behind ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
style = "fg:#585b70"
format = "[$duration ]($style)"

[character]
success_symbol = "[>>>](bold #3eb8a4)"
error_symbol = "[>>>](bold #e56b99)"

[python]
symbol = " "
style = "fg:#d4a031"
format = "[$symbol$version ]($style)"

[nodejs]
symbol = "󰎙 "
style = "fg:#05cb0d"
format = "[$symbol$version ]($style)"

[rust]
symbol = "󱘗 "
style = "fg:#d06a85"
format = "[$symbol$version ]($style)"

[golang]
symbol = "󰟓 "
style = "fg:#3eb8a4"
format = "[$symbol$version ]($style)"

[lua]
symbol = "󰢱 "
style = "fg:#6898d0"
format = "[$symbol$version ]($style)"
