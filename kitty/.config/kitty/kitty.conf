# ── Swordfish palette (managed by recolor.sh) ──────────────────────────
foreground  #c0caf5
background  #0d0c1a
cursor      #c0caf5

color0      #0d0c1a
color1      #f25d94
color2      #05cb0d
color3      #d4a031
color4      #6898d0
color5      #8a42f4
color6      #00d9e9
color7      #c0caf5
color8      #585b70
color9      #d06a85
color10     #3eb8a4
color11     #9a6dd7
color12     #6c35c4
color13     #9a6dd7
color14     #3eb8a4
color15     #c0caf5
# ── End palette ─────────────────────────────────────────────────────────

# Fonte e tamanho
font_size 12.0
font_family monospace

# Cursor personalizado
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback e performance
scrollback_lines 5000
repaint_delay 10
input_delay 3

# URLs destacadas
url_color #00d9e9
url_style curly
detect_urls yes

# Mouse
mouse_hide_wait 3.0
copy_on_select no

# Configuração de transparência
background_opacity 0.2
dynamic_background_opacity yes

confirm_os_window_close 0
